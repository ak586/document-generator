<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        line-height: 1.4;
      }
      .title {
        text-align: center;
        font-size: 24px;
        margin-bottom: 30px;
      }
      .line {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Transcript Request</h1>
    <p class="line"><strong>Name:</strong> {{studentName}}</p>
    <p class="line"><strong>Roll Number:</strong> {{rollNumber}}</p>
    <p class="line"><strong>Email:</strong> {{email}}</p>
    <p class="line"><strong>Phone:</strong> {{phone}}</p>
    <p class="line"><strong>Semester:</strong> {{semester}}</p>
    <p class="line"><strong>Notes:</strong> {{notes}}</p>
    <p class="line"><strong>Generated On:</strong> {{issuedDate}}</p>
  </body>
</html>
